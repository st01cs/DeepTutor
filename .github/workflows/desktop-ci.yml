name: Desktop Shell CI

# The desktop shell is a separate Rust workspace under desktop/. It only needs
# to build when its own tree (or this workflow) changes. The Python-side
# desktop contract (launcher flags, install mode) lives in tests/runtime and is
# covered by tests.yml instead.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every step here is a POSIX shell script (`set -euo pipefail`, line
    # continuations), and Windows would otherwise run them under pwsh — the
    # "Set up Rust" step failed with `Missing expression after unary operator
    # '--'` before this. Git Bash (which the Windows image ships) runs them
    # identically on both platforms.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 and Windows x64 are the two GA targets, Linux joins in
        # v1.x — see docs-for-user/DESKTOP_TAURI_PLAN.md. The Windows job is
        # what keeps the `cfg(windows)` halves of pack_tree / supervisor / window
        # / deeplink from rotting between releases: nothing else compiles them
        # until `desktop-release.yml` runs on a tag.
        include:
          - os: macos-14
            python: python3
          - os: windows-2022
            python: python
    env:
      # setup-python installs `python` on every platform but `python3` only
      # where the platform provides it, so the matrix names the interpreter
      # rather than the smoke scripts guessing. (The `runner` context is not
      # available to a job-level `env`, which is why this is a matrix key.)
      PYTHON: ${{ matrix.python }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-

      - name: Format
        working-directory: desktop
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        working-directory: desktop
        run: cargo test --locked

      - name: Build shell
        working-directory: desktop
        run: cargo build --locked

      # Opening a real window on a headless runner is not something to depend
      # on, so the smoke test covers what a runner can check: the shell starts,
      # resolves its runtime home and reports where it would put state and logs.
      - name: Headless smoke (config resolution)
        working-directory: desktop
        shell: bash
        env:
          DEEPTUTOR_HOME: ${{ runner.temp }}/deeptutor-home
          DEEPTUTOR_DESKTOP_WORKDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ./target/debug/deeptutor-desktop --self-check > self-check.json
          cat self-check.json
          "$PYTHON" -c "
          import json, os
          from pathlib import PurePath
          payload = json.load(open('self-check.json'))
          assert payload['shell'] == 'deeptutor-desktop', payload
          assert payload['home'] == os.environ['DEEPTUTOR_HOME'], payload
          assert payload['workdir'] == os.environ['DEEPTUTOR_DESKTOP_WORKDIR'], payload
          # PurePath, not string suffixes: Windows reports these with
          # backslashes.
          assert PurePath(payload['state_path']).parts[-2:] == ('desktop', 'runtime.json'), payload
          assert PurePath(payload['logs_dir']).parts[-1:] == ('logs',), payload
          print('self-check ok')
          "

      # Phase 3: the first-run wizard, its data-directory pointer and the
      # read-only update check are all reachable without a window, so a runner
      # can gate them here. `--check-updates` must never install anything.
      - name: Headless smoke (first run + settings + update check)
        working-directory: desktop
        shell: bash
        env:
          DEEPTUTOR_HOME: ${{ runner.temp }}/deeptutor-phase3
        run: |
          set -euo pipefail
          ./target/debug/deeptutor-desktop --first-run-status > first-run.json
          ./target/debug/deeptutor-desktop --complete-first-run \
            --locale en --data-dir "$DEEPTUTOR_HOME/data" > first-run-done.json
          ./target/debug/deeptutor-desktop --pack-status > packs.json
          "$PYTHON" -c "
          import json, os, pathlib
          first = json.load(open('first-run.json'))
          assert first['first_run']['completed'] is False, first
          assert first['first_run']['can_change_data_dir'] is True, first
          # The storage step the wizard shows: the profile root it redirects,
          # the data folder the product writes into, and the space left there.
          home = first['first_run']['home']
          data = first['first_run']['data_dir']
          assert data.startswith(home), first
          assert data.endswith('data'), first
          # Free space is a unix reading today; Windows reports null and the
          # wizard shows a not-readable note instead of guessing.
          free = first['first_run']['free_bytes']
          if os.name == 'nt':
              assert free is None, first
          else:
              assert free > 0, first

          done = json.load(open('first-run-done.json'))
          assert done['restart_required'] is True, done
          assert done['settings']['first_run_completed'] is True, done
          # The answers must travel with the pointer, or the wizard reappears.
          carried = json.loads(pathlib.Path(os.environ['DEEPTUTOR_HOME'], 'data', 'desktop', 'shell.json').read_text())
          assert carried['first_run_completed'] is True, carried
          assert carried['locale'] == 'en', carried

          # A catalog for *this* runner's platform, offering something newer.
          packs = json.load(open('packs.json'))
          assert packs['active_pack'] is None, packs
          assert packs['installed'] == [], packs
          catalog = {
            'schema_version': 1,
            'packs': [{
              'pack_id': 'deeptutor-runtime-9.9.9',
              'app_version': '9.9.9',
              'platform': packs['platform'],
              'url': 'deeptutor-runtime-9.9.9.tar.gz',
              'sha256': '0' * 64,
              'size': 1024,
            }],
          }
          pathlib.Path('runtime-packs.fixture.json').write_text(json.dumps(catalog))
          "
          # `set -e` makes this an exit-code assertion too: the command fails
          # only when the local runtime plane cannot answer. A runner that
          # cannot reach the update channel reports `error` for the shell plane
          # (the assertions below accept it), which is not a broken build.
          ./target/debug/deeptutor-desktop --check-updates \
            --catalog ./runtime-packs.fixture.json > updates.json
          "$PYTHON" -c "
          import json
          report = json.load(open('updates.json'))
          runtime = report['runtime']
          # The runtime plane must answer, and must not have installed anything.
          assert runtime['checked'] is True, report
          assert runtime['updated'] is False, report
          assert '9.9.9' in runtime['detail'], report
          # The shell plane reaches the update channel over the network, so a
          # runner without one reports error. What must hold either way is that
          # the check *ran* against this build's own version.
          shell_update = report['shell_update']
          assert shell_update['status'] in {'available', 'up_to_date', 'error'}, report
          assert shell_update['current_version'], report
          assert shell_update['detail'], report
          print('phase 3 headless smoke ok')
          "
