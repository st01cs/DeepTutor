<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepTutor</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1420;
        --card: #182234;
        --text: #eef2f8;
        --muted: #93a1bb;
        --accent: #5b8def;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 0%, #1c2740, var(--bg) 60%);
        color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .card {
        width: min(560px, 88vw);
        padding: 36px 32px 28px;
        border-radius: 18px;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .logo { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 18px 0 6px; font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
      .status { margin: 0 0 6px; font-size: 15px; }
      .hint { margin: 0; color: var(--muted); font-size: 13px; }
      .probe {
        margin: 18px 0 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--muted);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        white-space: pre-wrap;
        max-height: 220px;
        overflow: auto;
      }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      body.error .status { color: var(--danger); }
      body.error .hint { color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo.png" alt="DeepTutor" />
      <h1>DeepTutor</h1>
      <p id="status" class="status">正在启动本地服务 ...</p>
      <p id="hint" class="hint">
        首次启动需要准备运行环境，可能需要一点时间。启动失败时请查看
        <code>desktop/logs</code> 下的日志。
      </p>
      <button id="probe-button" type="button">桌面桥自检</button>
      <pre id="probe" class="probe" hidden></pre>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const probeEl = document.getElementById("probe");

      // Called from Rust through WebviewWindow::eval.
      window.setStatus = (text) => {
        statusEl.textContent = text;
      };
      window.showError = (text) => {
        statusEl.textContent = text;
        document.body.classList.add("error");
        probeEl.hidden = true;
      };

      function shellBridge() {
        return window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__.core : null;
      }

      document.getElementById("probe-button").addEventListener("click", async () => {
        probeEl.hidden = false;
        const bridge = shellBridge();
        if (!bridge) {
          probeEl.textContent = "no shell bridge: window.__TAURI__ is undefined";
          return;
        }
        try {
          const payload = await bridge.invoke("desktop_probe");
          probeEl.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          probeEl.textContent = "invoke failed: " + error;
        }
      });
    </script>
  </body>
</html>
