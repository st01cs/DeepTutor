[package]
name = "tauri-plugin-deeptutor"
# Kept in step with deeptutor/__version__.py by desktop/scripts/sync_version.py
# (Phase 2); until then bump by hand together with src-tauri.
version = "1.6.14"
edition = "2021"
rust-version = "1.77"
description = "Shell-side commands the DeepTutor UI is allowed to call"
license = "Apache-2.0"
links = "tauri-plugin-deeptutor"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native dialogs and "reveal in folder" are plugin-local: they need the calling
# window, not shell state, so they never cross the DesktopBackend trait.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Shell update plane: check/download/install the running app itself.
tauri-plugin-updater = "2"
# Base64 for `read_local_file` (a file dropped on the Dock icon travels to the
# UI as bytes so it can reuse the web upload pipeline).
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Free-space reporting for the first-run wizard's storage choice (statvfs), the
# same dependency and shape the shell crate uses for its unix-only calls.
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
